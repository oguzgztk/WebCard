  <g transform="translate(410 385) scale(1.7)"><path d="M0 0 L-30 20 L-4 -4 Z M0 0 L30 22 L4 -4 Z M0 0 L0 -40 L6 -2 Z M0 0 L-6 30 L4 4 Z"/></g>
</g>

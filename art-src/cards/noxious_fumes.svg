<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 427" width="640" height="427">
<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="72%">
    <stop offset="0" stop-color="#14200e"/>
    <stop offset="1" stop-color="#030402"/>
  </radialGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0 0.75  0 0 0 0.09 0"/>
  </filter>
  <filter id="fog" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.022" numOctaves="4" seed="11"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.32  0 0 0 0 0.45  0 0 0 0 0.25  0 0 0 0.32 -0.1"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="2" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/>
  </filter>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
  </radialGradient>

</defs>
<rect width="640" height="427" fill="url(#bg)"/>
<rect width="640" height="427" filter="url(#fog)" opacity="0.45"/>

<defs><radialGradient id="cloud" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#a8ff60" stop-opacity="0.85"/><stop offset="1" stop-color="#3a8a10" stop-opacity="0"/></radialGradient>
<filter id="puff" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="5"/><feDisplacementMap in="SourceGraphic" scale="40"/><feGaussianBlur stdDeviation="3"/></filter></defs>
<g filter="url(#puff)">
  <circle cx="220" cy="250" r="120" fill="url(#cloud)"/>
  <circle cx="380" cy="220" r="140" fill="url(#cloud)"/>
  <circle cx="320" cy="320" r="110" fill="url(#cloud)"/>
  <circle cx="480" cy="300" r="90" fill="url(#cloud)"/>
  <circle cx="140" cy="330" r="80" fill="url(#cloud)"/>
</g>
<!-- duman içinde kafatası -->
<g opacity="0.55" fill="#0e1a06">
  <path d="M290 200 C290 160 350 160 350 200 C350 222 340 228 340 240 L300 240 C300 228 290 222 290 200 Z"/>
</g>
<g fill="#d8ffb0"><circle cx="306" cy="204" r="9" opacity="0.8"/><circle cx="334" cy="204" r="9" opacity="0.8"/></g>
<g fill="#c0ff80" opacity="0.7"><circle cx="160" cy="160" r="4"/><circle cx="500" cy="150" r="3"/><circle cx="440" cy="370" r="3"/><circle cx="200" cy="380" r="2.5"/></g>

<rect width="640" height="427" fill="url(#vig)"/>
<rect width="640" height="427" filter="url(#grain)"/>
</svg>

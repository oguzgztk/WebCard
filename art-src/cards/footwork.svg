<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 427" width="640" height="427">
<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="72%">
    <stop offset="0" stop-color="#18222a"/>
    <stop offset="1" stop-color="#030405"/>
  </radialGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0 0.75  0 0 0 0.09 0"/>
  </filter>
  <filter id="fog" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.022" numOctaves="4" seed="11"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.42  0 0 0 0 0.48  0 0 0 0.32 -0.1"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="2" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/>
  </filter>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
  </radialGradient>

</defs>
<rect width="640" height="427" fill="url(#bg)"/>
<rect width="640" height="427" filter="url(#fog)" opacity="0.45"/>

<defs><linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60c0ff" stop-opacity="0"/><stop offset="1" stop-color="#c0f0ff" stop-opacity="0.9"/></linearGradient>
<linearGradient id="boot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a4a3a"/><stop offset="1" stop-color="#14100c"/></linearGradient></defs>
<g fill="none" stroke="url(#trail)" stroke-linecap="round">
  <path d="M60 300 C160 300 220 220 330 220" stroke-width="16" filter="url(#soft)"/>
  <path d="M90 360 C190 350 260 300 360 300" stroke-width="10"/>
  <path d="M120 150 C220 160 280 190 380 170" stroke-width="8" opacity="0.7"/>
</g>
<circle cx="320" cy="210" r="210" fill="none" stroke="#80d0ff" stroke-width="2" opacity="0.15"/>
<circle cx="320" cy="210" r="150" fill="none" stroke="#80d0ff" stroke-width="2" opacity="0.2" stroke-dasharray="20 14"/>
<g filter="url(#rough)" stroke="#060504" stroke-width="3" fill="url(#boot)">
  <path d="M370 140 L430 140 L436 250 C470 256 520 270 530 300 L530 318 L360 318 L360 270 Z"/>
  <path d="M360 318 L530 318 L530 332 L360 332 Z" fill="#2a1e14"/>
</g>
<path d="M376 180 L428 176 M378 210 L430 206" stroke="#8a7050" stroke-width="3"/>

<rect width="640" height="427" fill="url(#vig)"/>
<rect width="640" height="427" filter="url(#grain)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 427" width="640" height="427">
<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="72%">
    <stop offset="0" stop-color="#3a1a12"/>
    <stop offset="1" stop-color="#060202"/>
  </radialGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0 0.75  0 0 0 0.09 0"/>
  </filter>
  <filter id="fog" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.022" numOctaves="4" seed="11"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.32  0 0 0 0 0.28  0 0 0 0.32 -0.1"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="2" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/>
  </filter>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
  </radialGradient>

</defs>
<rect width="640" height="427" fill="url(#bg)"/>
<rect width="640" height="427" filter="url(#fog)" opacity="0.45"/>

<defs><radialGradient id="bull" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#8a5a3a"/><stop offset="1" stop-color="#1e0e06"/></radialGradient></defs>
<g stroke="#ff8040" stroke-width="5" opacity="0.5" stroke-linecap="round"><path d="M40 160 L180 160 M20 220 L170 220 M50 280 L190 280"/></g>
<g filter="url(#rough)" stroke="#0a0402" stroke-width="3" fill="url(#bull)">
  <path d="M220 150 C260 100 420 100 470 150 C500 200 480 280 430 300 L260 300 C220 280 200 200 220 150 Z"/>
  <path d="M260 140 C220 110 190 90 160 92 C190 110 210 130 236 160 Z" fill="#e8dcc0"/>
  <path d="M430 140 C470 110 500 90 530 92 C500 110 480 130 454 160 Z" fill="#e8dcc0"/>
</g>
<g fill="#ff4020"><circle cx="300" cy="190" r="8" filter="url(#glow)"/><circle cx="390" cy="190" r="8" filter="url(#glow)"/><circle cx="300" cy="190" r="3"/><circle cx="390" cy="190" r="3"/></g>
<path d="M330 260 L360 260" stroke="#e8c070" stroke-width="6" stroke-linecap="round"/>
<g fill="#c8a080" opacity="0.6"><circle cx="210" cy="340" r="12" filter="url(#soft)"/><circle cx="250" cy="360" r="16" filter="url(#soft)"/><circle cx="180" cy="370" r="10" filter="url(#soft)"/></g>
<rect width="640" height="427" fill="url(#vig)"/>
<rect width="640" height="427" filter="url(#grain)"/>
</svg>

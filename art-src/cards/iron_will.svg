<path d="M320 60 L320 140" stroke="#e8f0ff" stroke-width="4"/><path d="M322 62 L380 80 L322 100 Z" fill="#8a1a14" stroke="#1a0404" stroke-width="2"/>
<rect width="640" height="427" fill="url(#vig)"/>
<rect width="640" height="427" filter="url(#grain)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 427" width="640" height="427">
<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="72%">
    <stop offset="0" stop-color="#1e1a2a"/>
    <stop offset="1" stop-color="#040306"/>
  </radialGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0 0.75  0 0 0 0.09 0"/>
  </filter>
  <filter id="fog" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.022" numOctaves="4" seed="11"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.38  0 0 0 0 0.35  0 0 0 0 0.5  0 0 0 0.32 -0.1"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="2" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/>
  </filter>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
  </radialGradient>

</defs>
<rect width="640" height="427" fill="url(#bg)"/>
<rect width="640" height="427" filter="url(#fog)" opacity="0.45"/>

<defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d0ff70"/><stop offset="1" stop-color="#2a7008"/></linearGradient>
<linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0a0ff"/><stop offset="1" stop-color="#4a1070"/></linearGradient></defs>
<circle cx="320" cy="220" r="150" fill="#a060ff" opacity="0.14" filter="url(#glow)"/>
<!-- erlenmeyer -->
<path d="M292 80 L348 80 L348 160 L440 360 L200 360 L292 160 Z" fill="#0a0810" stroke="#c8c0e0" stroke-width="3"/>
<path d="M250 260 L390 260 L440 360 L200 360 Z" fill="url(#g1)"/>
<path d="M250 260 C290 240 350 290 390 260 L410 300 C360 320 290 280 232 300 Z" fill="url(#g2)" opacity="0.9"/>
<rect x="282" y="64" width="76" height="20" rx="4" fill="#4a3a5a" stroke="#120e18" stroke-width="3"/>
<!-- kabarcıklar ve duman -->
<g fill="#d8ffa0"><circle cx="300" cy="230" r="10"/><circle cx="336" cy="200" r="7"/><circle cx="318" cy="168" r="5"/><circle cx="330" cy="130" r="4"/></g>
<g fill="#e8c0ff"><circle cx="350" cy="236" r="8"/><circle cx="296" cy="190" r="5"/><circle cx="312" cy="110" r="3"/></g>
<path d="M320 60 C300 30 350 20 330 -10" stroke="#c0a0ff" stroke-width="10" fill="none" opacity="0.35" filter="url(#soft)"/>
<path d="M200 360 L440 360" stroke="#fff" stroke-width="2" opacity="0.2"/>

<rect width="640" height="427" fill="url(#vig)"/>
<rect width="640" height="427" filter="url(#grain)"/>
</svg>

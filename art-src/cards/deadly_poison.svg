<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 427" width="640" height="427">
<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="72%">
    <stop offset="0" stop-color="#162612"/>
    <stop offset="1" stop-color="#030502"/>
  </radialGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0 0.75  0 0 0 0.09 0"/>
  </filter>
  <filter id="fog" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.022" numOctaves="4" seed="11"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.45  0 0 0 0 0.25  0 0 0 0.32 -0.1"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="2" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/>
  </filter>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
  </radialGradient>

</defs>
<rect width="640" height="427" fill="url(#bg)"/>
<rect width="640" height="427" filter="url(#fog)" opacity="0.45"/>

<defs><linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c8f0c0" stop-opacity="0.35"/><stop offset="0.3" stop-color="#ffffff" stop-opacity="0.15"/><stop offset="1" stop-color="#204018" stop-opacity="0.5"/></linearGradient>
<linearGradient id="liq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b0ff60"/><stop offset="1" stop-color="#1a6008"/></linearGradient></defs>
<circle cx="320" cy="250" r="140" fill="#7aff30" opacity="0.18" filter="url(#glow)"/>
<path d="M280 70 L360 70 L360 150 C440 180 450 330 380 370 L260 370 C190 330 200 180 280 150 Z" fill="#081006" stroke="#a0d890" stroke-width="3"/>
<path d="M226 260 C250 250 390 250 414 260 C420 320 400 360 380 370 L260 370 C240 360 220 320 226 260 Z" fill="url(#liq)"/>
<path d="M280 70 L360 70 L360 150 C440 180 450 330 380 370 L260 370 C190 330 200 180 280 150 Z" fill="url(#glass)"/>
<rect x="272" y="48" width="96" height="26" rx="4" fill="#5a3a1a" stroke="#1a0e04" stroke-width="3"/>
<!-- kafatası -->
<g fill="#eaffe0" opacity="0.9">
  <path d="M300 280 C300 258 340 258 340 280 C340 292 334 296 334 304 L306 304 C306 296 300 292 300 280 Z"/>
  <circle cx="312" cy="282" r="5" fill="#0a2006"/><circle cx="328" cy="282" r="5" fill="#0a2006"/>
  <path d="M296 314 L344 330 M344 314 L296 330" stroke="#eaffe0" stroke-width="6" stroke-linecap="round"/>
</g>
<g fill="#b0ff70"><circle cx="300" cy="210" r="6"/><circle cx="336" cy="190" r="4"/><circle cx="318" cy="170" r="3"/></g>

<rect width="640" height="427" fill="url(#vig)"/>
<rect width="640" height="427" filter="url(#grain)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 427" width="640" height="427">
<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="72%">
    <stop offset="0" stop-color="#3a2010"/>
    <stop offset="1" stop-color="#070402"/>
  </radialGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0 0.75  0 0 0 0.09 0"/>
  </filter>
  <filter id="fog" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.022" numOctaves="4" seed="11"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.38  0 0 0 0 0.25  0 0 0 0.32 -0.1"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="2" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/>
  </filter>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
  </radialGradient>

</defs>
<rect width="640" height="427" fill="url(#bg)"/>
<rect width="640" height="427" filter="url(#fog)" opacity="0.45"/>

<defs><linearGradient id="iron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a8a90"/><stop offset="1" stop-color="#1a1a1e"/></linearGradient>
<radialGradient id="flame" cx="50%" cy="80%" r="70%"><stop offset="0" stop-color="#fff4c0"/><stop offset="0.4" stop-color="#ffa030"/><stop offset="1" stop-color="#ff4010" stop-opacity="0"/></radialGradient></defs>
<path d="M240 300 C200 220 260 170 250 100 C290 140 300 90 320 40 C340 90 350 140 390 100 C380 170 440 220 400 300 Z" fill="url(#flame)" filter="url(#soft)"/>
<path d="M280 300 C260 250 300 220 296 170 C316 200 320 170 330 140 C340 180 350 200 370 180 C370 230 380 260 360 300 Z" fill="#fff0b0" opacity="0.7" filter="url(#soft)"/>
<g filter="url(#rough)" stroke="#08080a" stroke-width="3" fill="url(#iron)">
  <path d="M170 290 L470 290 L470 316 C430 320 410 330 400 350 L240 350 C230 330 210 320 170 316 Z"/>
  <path d="M110 290 C130 280 160 282 170 290 L170 316 C140 312 120 304 110 290 Z"/>
  <path d="M260 350 L380 350 L400 410 L240 410 Z"/>
  <!-- çekiç -->
  <path d="M420 170 L500 150 L512 190 L432 210 Z"/>
  <path d="M452 196 L470 192 L500 286 L484 290 Z" fill="#4a2a10"/>
</g>
<g fill="#ffd080"><circle cx="210" cy="180" r="3"/><circle cx="420" cy="120" r="2.5"/><circle cx="360" cy="70" r="2"/><circle cx="250" cy="90" r="2"/></g>

<rect width="640" height="427" fill="url(#vig)"/>
<rect width="640" height="427" filter="url(#grain)"/>
</svg>

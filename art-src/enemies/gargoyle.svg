<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
<defs>
  <radialGradient id="bg" cx="50%" cy="45%" r="58%">
    <stop offset="0" stop-color="#26202e"/>
    <stop offset="1" stop-color="#050407"/>
  </radialGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0 0.75  0 0 0 0.09 0"/>
  </filter>
  <filter id="fog" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.022" numOctaves="4" seed="11"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.4  0 0 0 0 0.38  0 0 0 0 0.5  0 0 0 0.32 -0.1"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="2" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/>
  </filter>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
  </radialGradient>

</defs>
<rect width="600" height="400" fill="url(#bg)"/>
<rect width="600" height="400" filter="url(#fog)" opacity="0.3"/>

<defs>
  <linearGradient id="stone2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a94a0"/><stop offset="0.45" stop-color="#55505c"/><stop offset="1" stop-color="#1c1a20"/></linearGradient>
  <linearGradient id="wing2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a5464"/><stop offset="1" stop-color="#18161c"/></linearGradient>
</defs>
<rect x="160" y="320" width="280" height="40" rx="4" fill="#2a2830" stroke="#0e0d10" stroke-width="3"/>
<rect x="150" y="352" width="300" height="20" rx="3" fill="#1e1c22"/>
<g filter="url(#rough)" stroke="#0e0d10" stroke-width="3">
  <path d="M250 170 C200 110 150 70 70 60 C100 90 96 120 80 140 C110 130 130 150 126 176 C150 166 170 180 168 206 C190 196 214 206 222 226 Z" fill="url(#wing2)"/>
  <path d="M350 170 C400 110 450 70 530 60 C500 90 504 120 520 140 C490 130 470 150 474 176 C450 166 430 180 432 206 C410 196 386 206 378 226 Z" fill="url(#wing2)"/>
  <!-- çömelmiş gövde -->
  <path d="M240 170 C240 140 360 140 360 170 L372 260 C380 300 350 322 300 322 C250 322 220 300 228 260 Z" fill="url(#stone2)"/>
  <!-- bacaklar -->
  <path d="M232 262 C200 270 196 310 214 322 L262 322 C250 300 256 280 252 270 Z" fill="url(#stone2)"/>
  <path d="M368 262 C400 270 404 310 386 322 L338 322 C350 300 344 280 348 270 Z" fill="url(#stone2)"/>
  <!-- kollar/pençeler -->
  <path d="M248 200 C226 230 236 270 264 290 L280 282 C262 260 260 230 270 210 Z" fill="url(#stone2)"/>
  <path d="M352 200 C374 230 364 270 336 290 L320 282 C338 260 340 230 330 210 Z" fill="url(#stone2)"/>
  <!-- baş -->
  <path d="M262 108 C262 84 338 84 338 108 C346 130 336 160 300 166 C264 160 254 130 262 108 Z" fill="url(#stone2)"/>
  <!-- boynuzlar -->
  <path d="M270 96 C252 70 240 52 226 46 C246 64 254 82 262 104 Z" fill="#3a3640"/>
  <path d="M330 96 C348 70 360 52 374 46 C354 64 346 82 338 104 Z" fill="#3a3640"/>
</g>
<path d="M282 148 L290 160 L298 148 M302 148 L310 160 L318 148" fill="#d8d0c0"/>
<g fill="#c060ff">
  <ellipse cx="284" cy="124" rx="9" ry="5" filter="url(#glow)"/><ellipse cx="316" cy="124" rx="9" ry="5" filter="url(#glow)"/>
  <ellipse cx="284" cy="124" rx="5" ry="2.5" fill="#f0d0ff"/><ellipse cx="316" cy="124" rx="5" ry="2.5" fill="#f0d0ff"/>
</g>
<path d="M300 190 L294 220 L304 246 L298 280" stroke="#120f16" stroke-width="2" fill="none"/>

<rect width="600" height="400" fill="url(#vig)"/>
<rect width="600" height="400" filter="url(#grain)"/>
</svg>

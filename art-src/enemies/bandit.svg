<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
<defs>
  <radialGradient id="bg" cx="50%" cy="45%" r="58%">
    <stop offset="0" stop-color="#2e2418"/>
    <stop offset="1" stop-color="#050403"/>
  </radialGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0 0.75  0 0 0 0.09 0"/>
  </filter>
  <filter id="fog" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.022" numOctaves="4" seed="11"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.42  0 0 0 0 0.32  0 0 0 0.32 -0.1"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="2" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/>
  </filter>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
  </radialGradient>

</defs>
<rect width="600" height="400" fill="url(#bg)"/>
<rect width="600" height="400" filter="url(#fog)" opacity="0.3"/>

<defs><linearGradient id="cloak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3a28"/><stop offset="1" stop-color="#120c06"/></linearGradient>
<linearGradient id="knife" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6a6a72"/><stop offset="0.5" stop-color="#e8e8f0"/><stop offset="1" stop-color="#5a5a62"/></linearGradient></defs>
<g filter="url(#rough)" stroke="#0a0604" stroke-width="3">
  <path d="M300 60 C350 60 372 110 370 150 L410 360 L190 360 L230 150 C228 110 250 60 300 60 Z" fill="url(#cloak)"/>
  <path d="M300 74 C340 74 352 110 348 150 L252 150 C248 110 260 74 300 74 Z" fill="#100a06"/>
  <path d="M252 124 L348 124 L344 150 L256 150 Z" fill="#7a1a14"/>
  <path d="M232 200 C200 230 190 260 170 270 L186 286 C210 270 230 246 252 226 Z" fill="url(#cloak)"/>
  <path d="M368 200 C400 230 410 260 430 270 L414 286 C390 270 370 246 348 226 Z" fill="url(#cloak)"/>
  <path d="M168 276 L120 230 L128 222 L178 266 Z" fill="url(#knife)"/>
  <path d="M432 276 L480 230 L472 222 L422 266 Z" fill="url(#knife)"/>
  <path d="M250 230 L350 230 L346 248 L254 248 Z" fill="#5a3a18"/>
  <circle cx="300" cy="239" r="9" fill="#c49a40"/>
</g>
<g fill="#ffd070"><ellipse cx="282" cy="104" rx="7" ry="4" filter="url(#glow)"/><ellipse cx="318" cy="104" rx="7" ry="4" filter="url(#glow)"/><ellipse cx="282" cy="104" rx="3.5" ry="2"/><ellipse cx="318" cy="104" rx="3.5" ry="2"/></g>

<rect width="600" height="400" fill="url(#vig)"/>
<rect width="600" height="400" filter="url(#grain)"/>
</svg>

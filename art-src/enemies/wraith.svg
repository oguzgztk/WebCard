<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
<defs>
  <radialGradient id="bg" cx="50%" cy="45%" r="58%">
    <stop offset="0" stop-color="#16242a"/>
    <stop offset="1" stop-color="#030506"/>
  </radialGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0 0.75  0 0 0 0.09 0"/>
  </filter>
  <filter id="fog" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.022" numOctaves="4" seed="11"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.45  0 0 0 0 0.5  0 0 0 0.32 -0.1"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="2" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/>
  </filter>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
  </radialGradient>

</defs>
<rect width="600" height="400" fill="url(#bg)"/>
<rect width="600" height="400" filter="url(#fog)" opacity="0.3"/>

<defs>
  <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a4a58" stop-opacity="0.95"/><stop offset="0.7" stop-color="#10222a" stop-opacity="0.7"/><stop offset="1" stop-color="#0a1418" stop-opacity="0"/></linearGradient>
  <radialGradient id="hood" cx="50%" cy="60%" r="60%"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#1a3440"/></radialGradient>
</defs>
<ellipse cx="300" cy="170" rx="150" ry="130" fill="#80e0ff" opacity="0.1" filter="url(#glow)"/>
<g filter="url(#rough)">
  <path d="M300 50 C360 50 390 110 392 170 C400 230 430 280 440 380 C410 350 400 390 372 360 C350 395 330 360 300 392 C270 360 250 395 228 360 C200 390 190 350 160 380 C170 280 200 230 208 170 C210 110 240 50 300 50 Z" fill="url(#robe)"/>
  <path d="M300 62 C344 62 368 108 366 150 C360 186 330 200 300 200 C270 200 240 186 234 150 C232 108 256 62 300 62 Z" fill="url(#hood)"/>
  <!-- kollar -->
  <path d="M220 190 C180 210 150 240 120 250 C140 236 150 226 158 214 M380 190 C420 210 450 240 480 250 C460 236 450 226 442 214" stroke="#3a6a7a" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M120 250 L104 262 M120 250 L108 246 M120 250 L114 268 M480 250 L496 262 M480 250 L492 246 M480 250 L486 268" stroke="#a0d8e8" stroke-width="3" stroke-linecap="round"/>
</g>
<path d="M240 90 C260 70 340 70 360 90" stroke="#80c8d8" stroke-width="2" fill="none" opacity="0.6"/>
<g fill="#a0f0ff">
  <ellipse cx="280" cy="140" rx="10" ry="6" filter="url(#glow)"/><ellipse cx="320" cy="140" rx="10" ry="6" filter="url(#glow)"/>
  <ellipse cx="280" cy="140" rx="5" ry="3"/><ellipse cx="320" cy="140" rx="5" ry="3"/>
</g>
<g fill="#a0f0ff" opacity="0.5">
  <circle cx="150" cy="120" r="2"/><circle cx="460" cy="100" r="2.5"/><circle cx="420" cy="320" r="2"/><circle cx="180" cy="330" r="2"/><circle cx="510" cy="200" r="1.5"/>
</g>

<rect width="600" height="400" fill="url(#vig)"/>
<rect width="600" height="400" filter="url(#grain)"/>
</svg>

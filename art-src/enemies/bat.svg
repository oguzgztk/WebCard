<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
<defs>
  <radialGradient id="bg" cx="50%" cy="45%" r="58%">
    <stop offset="0" stop-color="#3a2a24"/>
    <stop offset="1" stop-color="#070505"/>
  </radialGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0 0.75  0 0 0 0.09 0"/>
  </filter>
  <filter id="fog" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.022" numOctaves="4" seed="11"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.4  0 0 0 0 0.35  0 0 0 0.55 -0.12"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="2" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/>
  </filter>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
  </radialGradient>

</defs>
<rect width="600" height="400" fill="url(#bg)"/>
<rect width="600" height="400" filter="url(#fog)" opacity="0.3"/>

<circle cx="300" cy="150" r="120" fill="#c8a070" opacity="0.18" filter="url(#glow)"/>
<defs>
  <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3530"/><stop offset="1" stop-color="#140c0a"/></linearGradient>
  <radialGradient id="body" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#6a4a3a"/><stop offset="1" stop-color="#1a100c"/></radialGradient>
</defs>
<g filter="url(#rough)">
  <!-- sol kanat -->
  <path d="M290 190 C240 130 170 95 70 110 C95 130 100 150 92 168 C120 160 140 172 140 190 C165 180 190 190 196 212 C220 200 250 205 270 222 Z" fill="url(#wing)" stroke="#8a5a40" stroke-width="2"/>
  <path d="M290 190 L92 168 M290 195 L140 190 M285 205 L196 212" stroke="#7a5038" stroke-width="2" opacity="0.7"/>
  <!-- sağ kanat -->
  <path d="M310 190 C360 130 430 95 530 110 C505 130 500 150 508 168 C480 160 460 172 460 190 C435 180 410 190 404 212 C380 200 350 205 330 222 Z" fill="url(#wing)" stroke="#8a5a40" stroke-width="2"/>
  <path d="M310 190 L508 168 M310 195 L460 190 M315 205 L404 212" stroke="#7a5038" stroke-width="2" opacity="0.7"/>
  <!-- gövde -->
  <ellipse cx="300" cy="215" rx="42" ry="60" fill="url(#body)" stroke="#9a6a48" stroke-width="2"/>
  <!-- baş + kulaklar -->
  <path d="M268 170 L276 118 L292 152 L308 152 L324 118 L332 170 C330 190 270 190 268 170 Z" fill="url(#body)" stroke="#9a6a48" stroke-width="2"/>
  <!-- dişler -->
  <path d="M288 178 L292 192 L296 178 M304 178 L308 192 L312 178" fill="#f0e0c8"/>
  <!-- ayaklar -->
  <path d="M285 272 L278 292 M315 272 L322 292" stroke="#3a2418" stroke-width="5" stroke-linecap="round"/>
</g>
<!-- gözler -->
<circle cx="287" cy="162" r="9" fill="#ff3a20" filter="url(#glow)"/>
<circle cx="313" cy="162" r="9" fill="#ff3a20" filter="url(#glow)"/>
<circle cx="287" cy="162" r="4" fill="#ffd0a0"/>
<circle cx="313" cy="162" r="4" fill="#ffd0a0"/>

<rect width="600" height="400" fill="url(#vig)"/>
<rect width="600" height="400" filter="url(#grain)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
<defs>
  <radialGradient id="bg" cx="50%" cy="45%" r="58%">
    <stop offset="0" stop-color="#1c2a18"/>
    <stop offset="1" stop-color="#040604"/>
  </radialGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0 0.75  0 0 0 0.09 0"/>
  </filter>
  <filter id="fog" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.022" numOctaves="4" seed="11"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.45  0 0 0 0 0.3  0 0 0 0.32 -0.1"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="2" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/>
  </filter>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
  </radialGradient>

</defs>
<rect width="600" height="400" fill="url(#bg)"/>
<rect width="600" height="400" filter="url(#fog)" opacity="0.3"/>

<defs>
  <linearGradient id="wrobe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a44"/><stop offset="1" stop-color="#0c0810"/></linearGradient>
  <radialGradient id="brew" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#d0ff80"/><stop offset="0.5" stop-color="#5ad020"/><stop offset="1" stop-color="#1a4a08"/></radialGradient>
  <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a2a2a"/><stop offset="0.4" stop-color="#5a5a5a"/><stop offset="1" stop-color="#0e0e0e"/></linearGradient>
</defs>
<ellipse cx="300" cy="290" rx="130" ry="70" fill="#6aff30" opacity="0.18" filter="url(#glow)"/>
<g filter="url(#rough)" stroke="#060408" stroke-width="3">
  <!-- asa -->
  <path d="M428 60 L440 62 L414 330 L402 328 Z" fill="#3a2414"/>
  <circle cx="434" cy="56" r="14" fill="#1a3a10"/>
  <!-- cüppe -->
  <path d="M300 70 C340 70 362 120 366 170 L400 330 L200 330 L234 170 C238 120 260 70 300 70 Z" fill="url(#wrobe)"/>
  <!-- kukuleta -->
  <path d="M300 60 C352 60 372 120 360 170 C340 150 260 150 240 170 C228 120 248 60 300 60 Z" fill="#2a1e34"/>
  <path d="M300 92 C330 92 344 120 340 160 L260 160 C256 120 270 92 300 92 Z" fill="#050306"/>
  <!-- kollar -->
  <path d="M244 190 C226 220 230 250 246 262 L268 246 C258 230 260 214 264 200 Z" fill="url(#wrobe)"/>
  <path d="M356 190 C390 200 404 180 410 170 L414 196 C400 216 376 226 352 220 Z" fill="url(#wrobe)"/>
  <!-- kazan -->
  <path d="M206 266 L394 266 C396 330 360 356 300 356 C240 356 204 330 206 266 Z" fill="url(#pot)"/>
  <ellipse cx="300" cy="266" rx="96" ry="18" fill="url(#brew)"/>
  <path d="M220 350 L210 376 M380 350 L390 376 M300 358 L300 382" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
</g>
<circle cx="434" cy="56" r="10" fill="#8aff40" filter="url(#glow)"/>
<g fill="#b0ff70">
  <ellipse cx="284" cy="128" rx="6" ry="4" filter="url(#glow)"/><ellipse cx="316" cy="128" rx="6" ry="4" filter="url(#glow)"/>
  <ellipse cx="284" cy="128" rx="3" ry="2"/><ellipse cx="316" cy="128" rx="3" ry="2"/>
</g>
<g fill="#9aff50" opacity="0.8">
  <circle cx="270" cy="250" r="7"/><circle cx="318" cy="238" r="5"/><circle cx="292" cy="222" r="4"/><circle cx="330" cy="210" r="3"/><circle cx="304" cy="196" r="2.5"/>
</g>
<path d="M240 260 C230 230 250 210 240 180 M360 262 C372 230 352 210 364 182" stroke="#8aff50" stroke-width="3" fill="none" opacity="0.35" filter="url(#soft)"/>

<rect width="600" height="400" fill="url(#vig)"/>
<rect width="600" height="400" filter="url(#grain)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
<defs>
  <radialGradient id="bg" cx="50%" cy="45%" r="58%">
    <stop offset="0" stop-color="#1e2a16"/>
    <stop offset="1" stop-color="#040503"/>
  </radialGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0 0.75  0 0 0 0.09 0"/>
  </filter>
  <filter id="fog" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.022" numOctaves="4" seed="11"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.4  0 0 0 0 0.48  0 0 0 0 0.3  0 0 0 0.32 -0.1"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="2" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/>
  </filter>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
  </radialGradient>

</defs>
<rect width="600" height="400" fill="url(#bg)"/>
<rect width="600" height="400" filter="url(#fog)" opacity="0.3"/>

<defs><linearGradient id="scale" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ad060"/><stop offset="0.5" stop-color="#3a6a20"/><stop offset="1" stop-color="#0e1a06"/></linearGradient>
<linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8c8a0"/><stop offset="1" stop-color="#7a5a3a"/></linearGradient>
<radialGradient id="crown" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff0a0"/><stop offset="1" stop-color="#c08a20"/></radialGradient></defs>
<circle cx="300" cy="160" r="160" fill="#c0ff60" opacity="0.08" filter="url(#glow)"/>
<g filter="url(#rough)" stroke="#060a04" stroke-width="3">
  <!-- kıvrımlı yılan gövdesi -->
  <path d="M260 230 C200 260 120 260 100 310 C80 360 180 380 300 370 C420 380 520 360 500 310 C480 270 400 280 350 250" fill="none" stroke="url(#scale)" stroke-width="44" stroke-linecap="round"/>
  <path d="M500 310 C530 330 550 300 540 280" fill="none" stroke="url(#scale)" stroke-width="22" stroke-linecap="round"/>
  <!-- insan üst gövde -->
  <path d="M260 250 C256 200 270 160 300 156 C330 160 344 200 340 250 Z" fill="url(#skin)"/>
  <path d="M262 190 C230 200 214 230 210 250 L226 254 C234 232 248 216 270 208 Z" fill="url(#skin)"/>
  <path d="M338 190 C370 200 386 230 390 250 L374 254 C366 232 352 216 330 208 Z" fill="url(#skin)"/>
  <!-- baş -->
  <ellipse cx="300" cy="124" rx="32" ry="38" fill="url(#skin)"/>
  <!-- saç / yılan saçları -->
  <path d="M268 110 C250 140 240 180 236 210 M332 110 C350 140 360 180 364 210" stroke="#1a2a10" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- taç -->
  <path d="M266 92 L276 66 L288 86 L300 58 L312 86 L324 66 L334 92 Z" fill="url(#crown)"/>
</g>
<circle cx="300" cy="74" r="5" fill="#80ff60" filter="url(#glow)"/>
<g fill="#b0ff60"><ellipse cx="288" cy="124" rx="6" ry="3" filter="url(#glow)"/><ellipse cx="312" cy="124" rx="6" ry="3" filter="url(#glow)"/><ellipse cx="288" cy="124" rx="3" ry="1.5"/><ellipse cx="312" cy="124" rx="3" ry="1.5"/></g>
<g fill="#2a4a14" opacity="0.6"><circle cx="160" cy="300" r="5"/><circle cx="220" cy="350" r="5"/><circle cx="330" cy="360" r="5"/><circle cx="440" cy="340" r="5"/><circle cx="480" cy="300" r="5"/></g>

<rect width="600" height="400" fill="url(#vig)"/>
<rect width="600" height="400" filter="url(#grain)"/>
</svg>

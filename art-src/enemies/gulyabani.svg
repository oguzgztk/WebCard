<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
<defs>
  <radialGradient id="bg" cx="50%" cy="45%" r="58%">
    <stop offset="0" stop-color="#2a1c1a"/>
    <stop offset="1" stop-color="#050303"/>
  </radialGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0 0.75  0 0 0 0.09 0"/>
  </filter>
  <filter id="fog" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.022" numOctaves="4" seed="11"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.48  0 0 0 0 0.38  0 0 0 0 0.36  0 0 0 0.32 -0.1"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="2" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/>
  </filter>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
  </radialGradient>

</defs>
<rect width="600" height="400" fill="url(#bg)"/>
<rect width="600" height="400" filter="url(#fog)" opacity="0.3"/>

<defs><radialGradient id="ghoul" cx="45%" cy="30%" r="75%"><stop offset="0" stop-color="#7a7060"/><stop offset="1" stop-color="#1a1610"/></radialGradient></defs>
<circle cx="300" cy="190" r="140" fill="#ff3030" opacity="0.08" filter="url(#glow)"/>
<g filter="url(#rough)" stroke="#080604" stroke-width="3" fill="url(#ghoul)">
  <!-- kambur gövde -->
  <path d="M220 170 C230 110 370 110 380 170 C400 230 390 300 360 340 L240 340 C210 300 200 230 220 170 Z"/>
  <!-- uzun kollar, yere sürtünen pençeler -->
  <path d="M226 190 C180 230 160 290 150 350 L176 352 C186 300 206 250 246 214 Z"/>
  <path d="M374 190 C420 230 440 290 450 350 L424 352 C414 300 394 250 354 214 Z"/>
  <!-- baş -->
  <path d="M256 120 C252 80 348 80 344 120 C346 150 330 170 300 174 C270 170 254 150 256 120 Z"/>
</g>
<g stroke="#d8d0c0" stroke-width="5" stroke-linecap="round"><path d="M146 352 L134 372 M156 352 L152 376 M168 352 L172 374"/><path d="M454 352 L466 372 M444 352 L448 376 M432 352 L428 374"/></g>
<path d="M276 150 L282 166 L288 150 L294 168 L300 150 L306 168 L312 150 L318 166 L324 150" stroke="#e8e0c8" stroke-width="3" fill="#2a0806"/>
<g fill="#ff4030"><circle cx="282" cy="118" r="8" filter="url(#glow)"/><circle cx="318" cy="118" r="8" filter="url(#glow)"/><circle cx="282" cy="118" r="3.5" fill="#ffd0b0"/><circle cx="318" cy="118" r="3.5" fill="#ffd0b0"/></g>
<path d="M240 260 C270 250 330 250 360 260" stroke="#3a3020" stroke-width="3" fill="none"/>
<path d="M300 176 C298 200 304 220 300 240" stroke="#8a1010" stroke-width="4" fill="none" opacity="0.7"/>

<rect width="600" height="400" fill="url(#vig)"/>
<rect width="600" height="400" filter="url(#grain)"/>
</svg>

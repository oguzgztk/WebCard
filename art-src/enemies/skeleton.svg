<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
<defs>
  <radialGradient id="bg" cx="50%" cy="45%" r="58%">
    <stop offset="0" stop-color="#2a2f28"/>
    <stop offset="1" stop-color="#050605"/>
  </radialGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0 0.75  0 0 0 0.09 0"/>
  </filter>
  <filter id="fog" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.022" numOctaves="4" seed="11"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.4  0 0 0 0 0.45  0 0 0 0 0.4  0 0 0 0.55 -0.12"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="2" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/>
  </filter>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
  </radialGradient>

</defs>
<rect width="600" height="400" fill="url(#bg)"/>
<rect width="600" height="400" filter="url(#fog)" opacity="0.3"/>

<defs>
  <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ece2c8"/><stop offset="1" stop-color="#7a6e58"/></linearGradient>
  <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a5030"/><stop offset="1" stop-color="#2a1c10"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a8a90"/><stop offset="0.5" stop-color="#d8d8e0"/><stop offset="1" stop-color="#6a6a70"/></linearGradient>
</defs>
<g filter="url(#rough)">
  <!-- kılıç -->
  <path d="M410 70 L424 76 L380 250 L368 246 Z" fill="url(#steel)" stroke="#3a3a40" stroke-width="2"/>
  <rect x="352" y="240" width="44" height="10" rx="3" fill="#5a4020" transform="rotate(14 374 245)"/>
  <!-- omurga + kaburgalar -->
  <rect x="294" y="190" width="12" height="120" rx="5" fill="url(#bone)"/>
  <g fill="none" stroke="url(#bone)" stroke-width="9" stroke-linecap="round">
    <path d="M300 205 C260 205 252 230 262 240 M300 205 C340 205 348 230 338 240"/>
    <path d="M300 228 C262 228 256 252 266 262 M300 228 C338 228 344 252 334 262"/>
    <path d="M300 251 C268 251 264 270 272 280 M300 251 C332 251 336 270 328 280"/>
  </g>
  <!-- leğen -->
  <path d="M268 305 C280 330 320 330 332 305 L320 322 L300 330 L280 322 Z" fill="url(#bone)"/>
  <!-- kollar -->
  <path d="M262 205 L220 250 L196 285" stroke="url(#bone)" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M338 205 L362 238 L376 248" stroke="url(#bone)" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- kalkan -->
  <path d="M150 230 L240 230 L236 300 C230 340 196 360 195 362 C194 360 160 340 154 300 Z" fill="url(#shield)" stroke="#a07840" stroke-width="4"/>
  <path d="M195 240 L195 350 M160 280 L232 280" stroke="#a07840" stroke-width="3" opacity="0.7"/>
  <!-- kafatası -->
  <path d="M258 120 C258 78 342 78 342 120 C342 145 332 152 328 168 L272 168 C268 152 258 145 258 120 Z" fill="url(#bone)" stroke="#5a5040" stroke-width="2"/>
  <path d="M276 168 L276 186 L324 186 L324 168" fill="url(#bone)"/>
  <path d="M284 170 L284 184 M294 170 L294 186 M304 170 L304 186 M314 170 L314 184" stroke="#3a3428" stroke-width="2"/>
  <path d="M296 140 L300 152 L304 140 Z" fill="#1a1810"/>
  <!-- miğfer kırığı -->
  <path d="M256 112 C262 70 338 70 344 112 L332 106 C320 90 280 90 268 106 Z" fill="#4a4840" stroke="#8a8478" stroke-width="2"/>
</g>
<ellipse cx="282" cy="128" rx="13" ry="12" fill="#0a0c08"/>
<ellipse cx="318" cy="128" rx="13" ry="12" fill="#0a0c08"/>
<circle cx="282" cy="129" r="6" fill="#7aff6a" filter="url(#glow)"/>
<circle cx="318" cy="129" r="6" fill="#7aff6a" filter="url(#glow)"/>
<circle cx="282" cy="129" r="2.5" fill="#e0ffd8"/>
<circle cx="318" cy="129" r="2.5" fill="#e0ffd8"/>

<rect width="600" height="400" fill="url(#vig)"/>
<rect width="600" height="400" filter="url(#grain)"/>
</svg>

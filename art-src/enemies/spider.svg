<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
<defs>
  <radialGradient id="bg" cx="50%" cy="45%" r="58%">
    <stop offset="0" stop-color="#1f2a1c"/>
    <stop offset="1" stop-color="#040504"/>
  </radialGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0 0.75  0 0 0 0.09 0"/>
  </filter>
  <filter id="fog" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.022" numOctaves="4" seed="11"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.45  0 0 0 0 0.3  0 0 0 0.32 -0.1"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="2" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/>
  </filter>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
  </radialGradient>

</defs>
<rect width="600" height="400" fill="url(#bg)"/>
<rect width="600" height="400" filter="url(#fog)" opacity="0.3"/>

<defs>
  <radialGradient id="abd" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#5a3a6a"/><stop offset="0.6" stop-color="#22142a"/><stop offset="1" stop-color="#0a060c"/></radialGradient>
  <radialGradient id="ceph" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#4a3050"/><stop offset="1" stop-color="#0e0810"/></radialGradient>
</defs>
<!-- ağ -->
<g stroke="#c8d8c0" stroke-width="1" opacity="0.18" fill="none">
  <path d="M300 0 L300 400 M0 200 L600 200 M40 0 L560 400 M560 0 L40 400"/>
  <circle cx="300" cy="200" r="60"/><circle cx="300" cy="200" r="120"/><circle cx="300" cy="200" r="190"/>
</g>
<circle cx="300" cy="190" r="140" fill="#6aff40" opacity="0.07" filter="url(#glow)"/>
<g stroke="#120a14" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M270 210 L190 150 L120 210 M270 220 L170 210 L110 290 M275 230 L190 270 L150 350 M280 236 L230 300 L215 370"/>
  <path d="M330 210 L410 150 L480 210 M330 220 L430 210 L490 290 M325 230 L410 270 L450 350 M320 236 L370 300 L385 370"/>
</g>
<g stroke="#5a3a60" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8">
  <path d="M270 210 L190 150 L120 210 M270 220 L170 210 L110 290 M275 230 L190 270 L150 350 M280 236 L230 300 L215 370"/>
  <path d="M330 210 L410 150 L480 210 M330 220 L430 210 L490 290 M325 230 L410 270 L450 350 M320 236 L370 300 L385 370"/>
</g>
<ellipse cx="300" cy="140" rx="78" ry="70" fill="url(#abd)"/>
<path d="M260 110 C285 95 315 95 340 110 M255 140 C285 125 315 125 345 140" stroke="#9a5ab0" stroke-width="3" fill="none" opacity="0.6"/>
<path d="M300 92 L292 116 L300 128 L308 116 Z" fill="#c040ff" opacity="0.7"/>
<ellipse cx="300" cy="228" rx="48" ry="40" fill="url(#ceph)"/>
<g fill="#7aff40">
  <circle cx="284" cy="220" r="7" filter="url(#glow)"/><circle cx="316" cy="220" r="7" filter="url(#glow)"/>
  <circle cx="284" cy="220" r="4"/><circle cx="316" cy="220" r="4"/>
  <circle cx="294" cy="208" r="3"/><circle cx="306" cy="208" r="3"/>
</g>
<path d="M288 258 C284 274 290 282 292 290 M312 258 C316 274 310 282 308 290" stroke="#d8c8b0" stroke-width="5" stroke-linecap="round" fill="none"/>
<path d="M292 292 L292 312 M308 292 L308 318" stroke="#6aff40" stroke-width="3" stroke-linecap="round" filter="url(#soft)"/>
<circle cx="308" cy="324" r="4" fill="#8aff60"/>

<rect width="600" height="400" fill="url(#vig)"/>
<rect width="600" height="400" filter="url(#grain)"/>
</svg>
